name: BigBear CI
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  ci:
    if: "!contains(github.head_ref, 'renovate/')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.0
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4.2.0
        name: Install pnpm
        id: pnpm-install
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install
      - name: Resolve diff range
        id: diff-range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            echo "base_sha=${{ github.event.before }}" >> $GITHUB_OUTPUT
            echo "head_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Check credential policy (changed files)
        run: |
          pnpm run check:credential-policy -- --base-sha "${{ steps.diff-range.outputs.base_sha }}" --head-sha "${{ steps.diff-range.outputs.head_sha }}"

      - name: Check sensitive content (changed files)
        run: |
          pnpm run check:sensitive-content -- --base-sha "${{ steps.diff-range.outputs.base_sha }}" --head-sha "${{ steps.diff-range.outputs.head_sha }}"

      - name: Run global tests
        run: pnpm test

      # - name: Run linter
      #   run: pnpm run lint
