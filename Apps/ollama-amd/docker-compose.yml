name: big-bear-ollama-amd
services:
  big-bear-ollama-amd:
    container_name: big-bear-ollama-amd
    image: ollama/ollama:0.17.6-rocm
    restart: unless-stopped
    environment:
      - PORT=11434
    volumes:
      - /DATA/.docker/AppData/$AppID/.ollama:/root/.ollama
    ports:
      - '11434:11434'
    devices:
      - /dev/kfd
      - /dev/dri
    x-casaos:
      envs:
        - container: PORT
          description:
            en_us: 'Container Variable: PORT'
      volumes:
        - container: /root/.ollama
          description:
            en_us: 'Container Path: /root/.ollama'
      ports:
        - container: '11434'
          description:
            en_us: 'Container Port: 11434'
x-casaos:
  architectures:
    - amd64
    - arm64
  main: big-bear-ollama-amd
  description:
    en_us: Get up and running with Llama 3, Mistral, Gemma, and other large language models.
  tagline:
    en_us: LLMs inference server with OpenAI compatible API
  developer: ollama
  author: BigBearTechWorld
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/ollama.png
  thumbnail: ''
  title:
    en_us: Ollama - AMD
  category: BigBearCasaOS
  port_map: '11434'

