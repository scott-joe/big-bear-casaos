name: big-bear-planka-v2
services:
  big-bear-planka-v2:
    container_name: big-bear-planka-v2
    image: ghcr.io/plankanban/planka:2.0.1
    restart: unless-stopped
    volumes:
      - /DATA/.docker/AppData/$AppID/data:/app/data
      - /DATA/.docker/AppData/$AppID/background-images:/app/public/background-images
      - /DATA/.docker/AppData/$AppID/user-avatars:/app/public/user-avatars
      - /DATA/.docker/AppData/$AppID/project-background-images:/app/public/project-background-images
      - /DATA/.docker/AppData/$AppID/attachments:/app/private/attachments
    ports:
      - '12123:1337'
    environment:
      - BASE_URL=http://[YOUR_CASAOS_LAN_IP]:3001
      - DATABASE_URL=postgresql://postgres@big-bear-planka-v2-postgres/planka
      - SECRET_KEY=notsecretkey
      - DEFAULT_ADMIN_EMAIL=demo@demo.demo
      - DEFAULT_ADMIN_PASSWORD=demo
      - DEFAULT_ADMIN_NAME=Demo Demo
      - DEFAULT_ADMIN_USERNAME=demo
    networks:
      - big-bear-planka-v2-network
    depends_on:
      big-bear-planka-v2-postgres:
        condition: service_healthy
    x-casaos:
      envs:
        - container: BASE_URL
          description:
            en_us: 'Container Variable: BASE_URL'
        - container: DATABASE_URL
          description:
            en_us: 'Container Variable: DATABASE_URL'
        - container: SECRET_KEY
          description:
            en_us: 'Container Variable: SECRET_KEY'
        - container: DEFAULT_ADMIN_EMAIL
          description:
            en_us: 'Container Variable: DEFAULT_ADMIN_EMAIL'
        - container: DEFAULT_ADMIN_PASSWORD
          description:
            en_us: 'Container Variable: DEFAULT_ADMIN_PASSWORD'
        - container: DEFAULT_ADMIN_NAME
          description:
            en_us: 'Container Variable: DEFAULT_ADMIN_NAME'
        - container: DEFAULT_ADMIN_USERNAME
          description:
            en_us: 'Container Variable: DEFAULT_ADMIN_USERNAME'
      volumes:
        - container: /app/data
          description:
            en_us: 'Container Path: /app/data'
        - container: /app/public/background-images
          description:
            en_us: 'Container Path: /app/public/background-images'
        - container: /app/public/user-avatars
          description:
            en_us: 'Container Path: /app/public/user-avatars'
        - container: /app/public/project-background-images
          description:
            en_us: 'Container Path: /app/public/project-background-images'
        - container: /app/private/attachments
          description:
            en_us: 'Container Path: /app/private/attachments'
      ports:
        - container: '1337'
          description:
            en_us: 'Container Port: 1337'
  big-bear-planka-v2-postgres:
    image: postgres:14-alpine
    restart: on-failure
    volumes:
      - /DATA/.docker/AppData/$AppID/postgresql:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=planka
      - POSTGRES_HOST_AUTH_METHOD=trust
    networks:
      - big-bear-planka-v2-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d planka
      interval: 10s
      timeout: 5s
      retries: 5
    x-casaos:
      envs:
        - container: POSTGRES_DB
          description:
            en_us: 'Container Variable: POSTGRES_DB'
        - container: POSTGRES_HOST_AUTH_METHOD
          description:
            en_us: 'Container Variable: POSTGRES_HOST_AUTH_METHOD'
      volumes:
        - container: /var/lib/postgresql/data
          description:
            en_us: 'Container Path: /var/lib/postgresql/data'
networks:
  big-bear-planka-v2-network:
    driver: bridge
x-casaos:
  architectures:
    - amd64
    - arm64
  main: big-bear-planka-v2
  description:
    en_us: The realtime kanban board for workgroups built with React and Redux.
  tagline:
    en_us: Free open source kanban board for workgroups.
  developer: plankanban
  author: BigBearTechWorld
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/planka.png
  thumbnail: ''
  tips:
    before_install:
      en_us: |-
        🆕 PLANKA V2 - SEPARATE APP

        This is a NEW app, separate from 'planka' (v1). Both can run simultaneously.

        FOR NEW USERS:
        ✅ Install this app for new Planka deployments
        ✅ Modern v2 architecture with unified data directory
        ✅ Enhanced security (SSRF protection)
        ✅ New features: user mentions, task linking, webhooks UI, SMTP UI

        FOR V1 USERS:
        ⚠️  Do NOT uninstall your 'planka' v1 app
        ⚠️  Deploy this as a NEW app alongside v1
        ⚠️  Migration is ONE-WAY with NO ROLLBACK
        ⚠️  Requires manual data migration: https://docs.planka.cloud/docs/upgrade-to-v2/docker/
        ⚠️  Must be on v1 >= 1.26.2, subdomain hosting required

        Detailed migration guide: https://community.bigbeartechworld.com/t/added-planka-to-bigbearcasaos/924
  title:
    en_us: Planka v2
  category: BigBearCasaOS
  port_map: '12123'

