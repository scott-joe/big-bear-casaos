name: big-bear-uptime-kuma
services:
  app:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    volumes:
      - /DATA/.docker/AppData/$AppID/data:/app/data
    ports:
      - '12175:3001'
    restart: always
    x-casaos:
      volumes:
        - container: /app/data
          description:
            en_us: 'Container Path: /app/data'
      ports:
        - container: '3001'
          description:
            en_us: 'Container Port: 3001'
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_us: A fancy self-hosted monitoring tool
  tagline:
    en_us: A fancy self-hosted monitoring tool
  developer: louislam
  author: BigBearTechWorld
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/uptime-kuma.png
  thumbnail: ''
  title:
    en_us: Uptime Kuma
  category: BigBearCasaOS
  port_map: '12175'

