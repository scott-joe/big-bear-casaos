name: big-bear-codex-docs
services:
  app:
    image: ghcr.io/codex-team/codex.docs:v2.2
    ports:
      - '12017:3000'
    volumes:
      - /DATA/.docker/AppData/$AppID/uploads:/usr/src/app/uploads
      - /DATA/.docker/AppData/$AppID/db:/usr/src/app/db
      - /DATA/.docker/AppData/$AppID/codex-docs-config.local.yaml:/usr/src/app/docs-config.yaml
    x-casaos:
      volumes:
        - container: /usr/src/app/uploads
          description:
            en_us: 'Container Path: /usr/src/app/uploads'
        - container: /usr/src/app/db
          description:
            en_us: 'Container Path: /usr/src/app/db'
        - container: /usr/src/app/docs-config.yaml
          description:
            en_us: 'Container Path: /usr/src/app/docs-config.yaml'
      ports:
        - container: '3000'
          description:
            en_us: 'Container Port: 3000'
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_us: CodeX Docs is a free docs application. It's based on Editor.js ecosystem which gives all modern opportunities for working with content.
  tagline:
    en_us: CodeX Docs
  developer: codex-team
  author: BigBearTechWorld
  icon: https://cdn.jsdelivr.net/gh/bigbeartechworld/big-bear-universal-apps/apps/codex-docs/logo.jpg
  thumbnail: ''
  title:
    en_us: CodeX Docs
  category: BigBearCasaOS
  port_map: '12017'

