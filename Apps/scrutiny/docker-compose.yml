name: big-bear-scrutiny
services:
  big-bear-scrutiny:
    container_name: big-bear-scrutiny
    image: ghcr.io/analogj/scrutiny:master-omnibus
    restart: unless-stopped
    volumes:
      - /DATA/.docker/AppData/$AppID/config:/opt/scrutiny/config
      - /DATA/.docker/AppData/$AppID/influxdb:/opt/scrutiny/influxdb
      - /run/udev:/run/udev:ro
    ports:
      - '38080:8080'
      - '38086:8086'
    cap_add:
      - SYS_RAWIO
    devices:
      - /dev/sda:/dev/sda
      - /dev/nvme0:/dev/nvme0
    privileged: true
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - http://localhost:8080/api/health
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
    x-casaos:
      volumes:
        - container: /opt/scrutiny/config
          description:
            en_us: 'Container Path: /opt/scrutiny/config'
        - container: /opt/scrutiny/influxdb
          description:
            en_us: 'Container Path: /opt/scrutiny/influxdb'
        - container: /run/udev
          description:
            en_us: 'Container Path: /run/udev'
      ports:
        - container: '8080'
          description:
            en_us: 'Container Port: 8080'
        - container: '8086'
          description:
            en_us: 'Container Port: 8086'
x-casaos:
  architectures:
    - amd64
    - arm64
  main: big-bear-scrutiny
  description:
    en_us: If you run a server with more than a couple of hard drives, you're probably already familiar with S.M.A.R.T and the smartd daemon.
  tagline:
    en_us: Monitor your server's hard disk health
  developer: analogj
  author: BigBearTechWorld
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/scrutiny.png
  thumbnail: ''
  title:
    en_us: Scrutiny
  category: BigBearCasaOS
  port_map: '38080'

