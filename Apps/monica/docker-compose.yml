name: big-bear-monica
services:
  big-bear-monica:
    container_name: big-bear-monica
    image: monica:4.1.2
    restart: unless-stopped
    environment:
      - APP_KEY=80356f7073c4f7834187b25a9d32cd2a
      - DB_HOST=big-bear-monica-db
      - DB_USERNAME=usermonica
      - DB_PASSWORD=passwordmonica
    volumes:
      - /DATA/.docker/AppData/$AppID/storage:/var/www/html/storage
    ports:
      - '12081:80'
    networks:
      - big_bear_monica_network
    x-casaos:
      envs:
        - container: APP_KEY
          description:
            en_us: 'Container Variable: APP_KEY'
        - container: DB_HOST
          description:
            en_us: 'Container Variable: DB_HOST'
        - container: DB_USERNAME
          description:
            en_us: 'Container Variable: DB_USERNAME'
        - container: DB_PASSWORD
          description:
            en_us: 'Container Variable: DB_PASSWORD'
      volumes:
        - container: /var/www/html/storage
          description:
            en_us: 'Container Path: /var/www/html/storage'
      ports:
        - container: '80'
          description:
            en_us: 'Container Port: 80'
  big-bear-monica-db:
    image: mariadb:10.6.11
    container_name: big-bear-monica-db
    environment:
      - TZ=UTC
      - MARIADB_RANDOM_ROOT_PASSWORD=true
      - MARIADB_DATABASE=monica
      - MARIADB_USER=usermonica
      - MARIADB_PASSWORD=passwordmonica
    volumes:
      - /DATA/.docker/AppData/$AppID/mysql:/var/lib/mysql
    restart: unless-stopped
    networks:
      - big_bear_monica_network
    x-casaos:
      envs:
        - container: TZ
          description:
            en_us: 'Container Variable: TZ'
        - container: MARIADB_RANDOM_ROOT_PASSWORD
          description:
            en_us: 'Container Variable: MARIADB_RANDOM_ROOT_PASSWORD'
        - container: MARIADB_DATABASE
          description:
            en_us: 'Container Variable: MARIADB_DATABASE'
        - container: MARIADB_USER
          description:
            en_us: 'Container Variable: MARIADB_USER'
        - container: MARIADB_PASSWORD
          description:
            en_us: 'Container Variable: MARIADB_PASSWORD'
      volumes:
        - container: /var/lib/mysql
          description:
            en_us: 'Container Path: /var/lib/mysql'
networks:
  big_bear_monica_network:
    driver: bridge
x-casaos:
  architectures:
    - amd64
    - arm64
  main: big-bear-monica
  description:
    en_us: Monica is an open-source web application to organize and record your interactions with your loved ones. We call it a PRM, or Personal Relationship Management. Think of it as a CRM (a popular tool used by sales teams in the corporate world) for your friends or family.
  tagline:
    en_us: A Personal Relationship Management tool to help you document your social life.
  developer: monica
  author: BigBearTechWorld
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/monica.png
  thumbnail: ''
  title:
    en_us: Monica
  category: BigBearCasaOS
  port_map: '12081'

