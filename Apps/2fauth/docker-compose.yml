name: big-bear-2fauth
services:
  app:
    container_name: big-bear-2fauth
    image: 2fauth/2fauth:6.0.0
    restart: unless-stopped
    ports:
      - '8000:8000'
    network_mode: bridge
    volumes:
      - /DATA/.docker/AppData/$AppID/data:/2fauth
    environment:
      - APP_URL=http://[CHANGE_TO_LAN_IP]:8000
    x-casaos:
      envs:
        - container: APP_URL
          description:
            en_us: 'Container Variable: APP_URL'
      volumes:
        - container: /2fauth
          description:
            en_us: 'Container Path: /2fauth'
      ports:
        - container: '8000'
          description:
            en_us: 'Container Port: 8000'
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_us: A Web app to manage your Two-Factor Authentication (2FA) accounts and generate their security codes
  tagline:
    en_us: A Web app to manage your Two-Factor Authentication (2FA) accounts and generate their security codes
  developer: bubka
  author: BigBearTechWorld
  icon: https://user-images.githubusercontent.com/1289128/276442834-bdb528d0-78fa-4155-ba15-7165d88b9836.png
  thumbnail: ''
  title:
    en_us: 2FAuth
  category: BigBearCasaOS
  port_map: '8000'

