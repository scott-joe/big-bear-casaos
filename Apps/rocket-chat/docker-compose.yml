name: big-bear-rocket-chat
services:
  app:
    container_name: big-bear-rocket-chat
    image: rocket.chat:6.13.1
    restart: unless-stopped
    environment:
      MONGO_OPLOG_URL: mongodb://db:27017/local
      ROOT_URL: http://localhost:3000
    ports:
      - '12140:3000'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rocketchat-net
    x-casaos:
      envs:
        - container: MONGO_OPLOG_URL
          description:
            en_us: 'Container Variable: MONGO_OPLOG_URL'
        - container: ROOT_URL
          description:
            en_us: 'Container Variable: ROOT_URL'
      ports:
        - container: '3000'
          description:
            en_us: 'Container Port: 3000'
  db:
    image: mongo:4.4.28
    container_name: big-bear-rocketchat-db
    volumes:
      - /DATA/.docker/AppData/$AppID/db:/data/db
    healthcheck:
      test:
        - CMD
        - mongo
        - '--eval'
        - db.stats()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rocketchat-net
    x-casaos:
      volumes:
        - container: /data/db
          description:
            en_us: 'Container Path: /data/db'
networks:
  rocketchat-net:
    driver: bridge
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_us: Rocket.Chat is an open-source fully customizable communications platform [...]
  tagline:
    en_us: The communications platform that puts data protection first.
  developer: rocket.chat
  author: BigBearTechWorld
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/rocket-chat.png
  thumbnail: ''
  title:
    en_us: Rocket.Chat
  category: BigBearCasaOS
  port_map: '12140'

