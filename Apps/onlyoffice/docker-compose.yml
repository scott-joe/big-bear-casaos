name: big-bear-onlyoffice
services:
  app:
    image: onlyoffice/documentserver:9.1.0
    container_name: documentserver
    ports:
      - '7400:80'
    volumes:
      - /DATA/.docker/AppData/$AppID/onlyoffice/logs:/var/log/onlyoffice
      - /DATA/.docker/AppData/$AppID/onlyoffice/data:/var/www/onlyoffice/Data
      - /DATA/.docker/AppData/$AppID/onlyoffice/lib:/var/lib/onlyoffice
      - /DATA/.docker/AppData/$AppID/onlyoffice/rabbitmq:/var/lib/rabbitmq
      - /DATA/.docker/AppData/$AppID/onlyoffice/redis:/var/lib/redis
      - /DATA/.docker/AppData/$AppID/onlyoffice/db:/var/lib/postgresql
    x-casaos:
      volumes:
        - container: /var/log/onlyoffice
          description:
            en_us: 'Container Path: /var/log/onlyoffice'
        - container: /var/www/onlyoffice/Data
          description:
            en_us: 'Container Path: /var/www/onlyoffice/Data'
        - container: /var/lib/onlyoffice
          description:
            en_us: 'Container Path: /var/lib/onlyoffice'
        - container: /var/lib/rabbitmq
          description:
            en_us: 'Container Path: /var/lib/rabbitmq'
        - container: /var/lib/redis
          description:
            en_us: 'Container Path: /var/lib/redis'
        - container: /var/lib/postgresql
          description:
            en_us: 'Container Path: /var/lib/postgresql'
      ports:
        - container: '80'
          description:
            en_us: 'Container Port: 80'
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_us: Feature-rich web-based office suite with a vast range of collaborative capabilities
  tagline:
    en_us: OnlyOffice
  developer: onlyoffice
  author: BigBearTechWorld
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/onlyoffice.png
  thumbnail: ''
  title:
    en_us: OnlyOffice
  category: BigBearCasaOS
  port_map: '7400'

