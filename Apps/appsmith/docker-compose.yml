name: big-bear-appsmith
services:
  app:
    image: appsmith/appsmith-ce:v1.73.1
    container_name: appsmith
    ports:
      - '12003:80'
      - '12004:443'
    volumes:
      - /DATA/.docker/AppData/$AppID/stacks:/appsmith-stacks
    restart: unless-stopped
    x-casaos:
      volumes:
        - container: /appsmith-stacks
          description:
            en_us: 'Container Path: /appsmith-stacks'
      ports:
        - container: '80'
          description:
            en_us: 'Container Port: 80'
        - container: '443'
          description:
            en_us: 'Container Port: 443'
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_us: Low code project to build admin panels, internal tools, and dashboards, integrating 15+ databases.
  tagline:
    en_us: Appsmith
  developer: appsmithorg
  author: BigBearTechWorld
  icon: https://cdn.jsdelivr.net/gh/appsmithorg/appsmith/static/logo.png
  thumbnail: ''
  title:
    en_us: Appsmith
  category: BigBearCasaOS
  port_map: '12003'

