name: big-bear-python-matter-server
services:
  app:
    image: ghcr.io/home-assistant-libs/python-matter-server:8.1.0
    container_name: matter-server
    restart: unless-stopped
    network_mode: host
    security_opt:
      - apparmor:unconfined
    volumes:
      - /DATA/.docker/AppData/$AppID/data:/data/
      - /run/dbus:/run/dbus:ro
    x-casaos:
      volumes:
        - container: /data/
          description:
            en_us: 'Container Path: /data/'
        - container: /run/dbus
          description:
            en_us: 'Container Path: /run/dbus'
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_us: This project implements a Matter Controller Server over WebSockets using the official Matter (formerly CHIP) SDK as a base and provides both a server and client implementation. The goal of this project is primary to have Matter support in Home Assistant but its universal approach makes it suitable to be used in other projects too.
  tagline:
    en_us: Python Matter Server
  developer: home-assistant-libs
  author: BigBearTechWorld
  icon: https://cdn.jsdelivr.net/gh/bigbeartechworld/big-bear-universal-apps/apps/python-matter-server/logo.png
  thumbnail: ''
  title:
    en_us: Python Matter Server
  category: BigBearCasaOS
  port_map: '5580'

