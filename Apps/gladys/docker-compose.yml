name: big-bear-gladys
services:
  app:
    image: gladysassistant/gladys:v4.69.0
    restart: always
    privileged: true
    network_mode: host
    container_name: gladys
    cgroup: host
    environment:
      NODE_ENV: production
      SQLITE_FILE_PATH: /var/lib/gladysassistant/gladys-production.db
      TZ: Europe/Paris
      SERVER_PORT: '1080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /DATA/.docker/AppData/$AppID/data:/var/lib/gladysassistant
      - /dev:/dev
      - /run/udev:/run/udev
    x-casaos:
      envs:
        - container: NODE_ENV
          description:
            en_us: 'Container Variable: NODE_ENV'
        - container: SQLITE_FILE_PATH
          description:
            en_us: 'Container Variable: SQLITE_FILE_PATH'
        - container: TZ
          description:
            en_us: 'Container Variable: TZ'
        - container: SERVER_PORT
          description:
            en_us: 'Container Variable: SERVER_PORT'
      volumes:
        - container: /var/run/docker.sock
          description:
            en_us: 'Container Path: /var/run/docker.sock'
        - container: /var/lib/gladysassistant
          description:
            en_us: 'Container Path: /var/lib/gladysassistant'
        - container: /dev
          description:
            en_us: 'Container Path: /dev'
        - container: /run/udev
          description:
            en_us: 'Container Path: /run/udev'
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_us: Gladys Assistant is a modern, privacy-first & open-source home automation software that runs anywhere.
  screenshot_link:
    - https://gladysassistant.com/img/home/main_screenshot/main_screenshot_en_j5czyj_c_scale,w_2526.png
  tagline:
    en_us: A privacy-first, open-source home assistant.
  developer: GladysAssistant
  author: BigBearTechWorld
  icon: https://gladysassistant.com/img/external/github-gladys-logo.png
  thumbnail: https://gladysassistant.com/img/home/main_screenshot/main_screenshot_en_j5czyj_c_scale,w_2526.png
  title:
    en_us: Gladys Assistant
  category: BigBearCasaOS
  port_map: '1080'

