name: big-bear-wishlist
services:
  big-bear-wishlist:
    container_name: big-bear-wishlist
    image: ghcr.io/cmintey/wishlist:v0.60.1
    restart: unless-stopped
    environment:
      ORIGIN: ''
      TOKEN_TIME: '72'
      DEFAULT_CURRENCY: USD
      LOG_LEVEL: info
    volumes:
      - /DATA/.docker/AppData/$AppID/uploads:/usr/src/app/uploads
      - /DATA/.docker/AppData/$AppID/data:/usr/src/app/data
    ports:
      - '3280:3280'
    x-casaos:
      envs:
        - container: ORIGIN
          description:
            en_us: 'Container Variable: ORIGIN'
        - container: TOKEN_TIME
          description:
            en_us: 'Container Variable: TOKEN_TIME'
        - container: DEFAULT_CURRENCY
          description:
            en_us: 'Container Variable: DEFAULT_CURRENCY'
        - container: LOG_LEVEL
          description:
            en_us: 'Container Variable: LOG_LEVEL'
      volumes:
        - container: /usr/src/app/uploads
          description:
            en_us: 'Container Path: /usr/src/app/uploads'
        - container: /usr/src/app/data
          description:
            en_us: 'Container Path: /usr/src/app/data'
      ports:
        - container: '3280'
          description:
            en_us: 'Container Port: 3280'
x-casaos:
  architectures:
    - amd64
    - arm64
  main: big-bear-wishlist
  description:
    en_us: Wishlist is a self-hosted wishlist application that you can share with your friends and family. You no longer have to wonder what to get your family for the holidays, simply check their wishlist and claim any available item!
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/bigbeartechworld/big-bear-universal-apps@main/apps/wishlist/screenshots/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/bigbeartechworld/big-bear-universal-apps@main/apps/wishlist/screenshots/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/bigbeartechworld/big-bear-universal-apps@main/apps/wishlist/screenshots/screenshot-3.png
  tagline:
    en_us: Wishlist is a self-hosted wishlist application that you can share with your friends and family.
  developer: cmintey
  author: BigBearTechWorld
  icon: https://cdn.jsdelivr.net/gh/bigbeartechworld/big-bear-universal-apps/apps/wishlist/logo.png
  thumbnail: https://cdn.jsdelivr.net/gh/bigbeartechworld/big-bear-universal-apps/apps/wishlist/thumbnail.png
  tips:
    before_install:
      en_us: |
        Read this before installing: https://community.bigbeartechworld.com/t/added-wishlist-to-bigbearcasaos/3555?u=dragonfire1119
  title:
    en_us: Wishlist
  category: BigBearCasaOS
  port_map: '3280'

