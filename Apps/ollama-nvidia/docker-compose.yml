name: big-bear-ollama-nvidia
services:
  big-bear-ollama-nvidia:
    container_name: big-bear-ollama-nvidia
    image: ollama/ollama:0.17.6
    restart: unless-stopped
    volumes:
      - /DATA/.docker/AppData/$AppID/.ollama:/root/.ollama
    ports:
      - '12094:11434'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    x-casaos:
      volumes:
        - container: /root/.ollama
          description:
            en_us: 'Container Path: /root/.ollama'
      ports:
        - container: '11434'
          description:
            en_us: 'Container Port: 11434'
x-casaos:
  architectures:
    - amd64
    - arm64
  main: big-bear-ollama-nvidia
  description:
    en_us: Get up and running with Llama 3, Mistral, Gemma, and other large language models.
  tagline:
    en_us: LLMs inference server with OpenAI compatible API
  developer: ollama
  author: BigBearTechWorld
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/ollama.png
  thumbnail: ''
  title:
    en_us: Ollama - NVIDIA
  category: BigBearCasaOS
  port_map: '12094'

