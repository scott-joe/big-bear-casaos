name: big-bear-portainer
services:
  app:
    container_name: big-bear-portainer
    image: portainer/portainer-ce:2.39.0-alpine
    network_mode: bridge
    ports:
      - '12127:8000'
      - '12128:9000'
      - '12129:9443'
    volumes:
      - /DATA/.docker/AppData/$AppID/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    x-casaos:
      volumes:
        - container: /data
          description:
            en_us: 'Container Path: /data'
        - container: /var/run/docker.sock
          description:
            en_us: 'Container Path: /var/run/docker.sock'
      ports:
        - container: '8000'
          description:
            en_us: 'Container Port: 8000'
        - container: '9000'
          description:
            en_us: 'Container Port: 9000'
        - container: '9443'
          description:
            en_us: 'Container Port: 9443'
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_us: Irrespective of your industry, orchestration platform, or computing device, Portainer is the most versatile container management software that simplifies your secure adoption of containers with remarkable speed.
  tagline:
    en_us: Portainer
  developer: portainer
  author: BigBearTechWorld
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/portainer.png
  thumbnail: ''
  title:
    en_us: Portainer
  category: BigBearCasaOS
  port_map: '12127'

