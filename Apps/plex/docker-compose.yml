name: big-bear-plex
services:
  big-bear-plex:
    container_name: big-bear-plex
    image: linuxserver/plex:1.43.0
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - VERSION=docker
      - PLEX_CLAIM=
    restart: unless-stopped
    network_mode: host
    volumes:
      - /DATA/.docker/AppData/$AppID/config:/config
      - /media/Safe-Storage/Library/TV:/tv
      - /media/Safe-Storage/Library/Movies:/movies
    x-casaos:
      envs:
        - container: PUID
          description:
            en_us: 'Container Variable: PUID'
        - container: PGID
          description:
            en_us: 'Container Variable: PGID'
        - container: TZ
          description:
            en_us: 'Container Variable: TZ'
        - container: VERSION
          description:
            en_us: 'Container Variable: VERSION'
        - container: PLEX_CLAIM
          description:
            en_us: 'Container Variable: PLEX_CLAIM'
      volumes:
        - container: /config
          description:
            en_us: 'Container Path: /config'
        - container: /tv
          description:
            en_us: 'Container Path: /tv'
        - container: /movies
          description:
            en_us: 'Container Path: /movies'
x-casaos:
  architectures:
    - amd64
    - arm64
  main: big-bear-plex
  description:
    en_us: Stream Movies & TV Shows
  tagline:
    en_us: Stream Movies & TV Shows
  developer: plexinc
  author: BigBearTechWorld
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/plex.png
  thumbnail: ''
  title:
    en_us: Plex
  category: BigBearCasaOS
  port_map: '32400'

